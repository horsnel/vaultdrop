name = "vaultdrop-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
REPO_OWNER = "horsnel"
REPO_NAME = "vaultdrop"
DATA_BRANCH = "data"

# GITHUB_TOKEN is set as a secret via: wrangler secret put GITHUB_TOKEN
# No KV namespace — data is stored in GitHub data branch

# Cron triggers for scheduled scraping
[triggers]
crons = ["*/15 * * * *"]

# Routes — serves the API at api.vaultdrop.pages.dev
routes = [
  { pattern = "api.vaultdrop.pages.dev/*", zone_name = "vaultdrop.pages.dev" }
]
