name = "vaultdrop-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
REPO_OWNER = "horsnel"
REPO_NAME = "vaultdrop"
DATA_BRANCH = "data"

# Secrets (set via: wrangler secret put <NAME>)
# - GITHUB_TOKEN:        GitHub PAT for repo read/write on data branch
# - REDDIT_CLIENT_ID:    Reddit app client ID for OAuth2
# - REDDIT_CLIENT_SECRET: Reddit app client secret for OAuth2
# - SCRAPER_SECRET:      Shared secret for authenticating /scraper/ingest requests

# Cron triggers for scheduled scraping (every 15 minutes)
[triggers]
crons = ["*/15 * * * *"]

# Custom domain can be added later via Cloudflare dashboard
# Dashboard > Workers > vaultdrop-worker > Settings > Triggers > Custom Domains
