name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scraper.mjs'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            GITHUB_TOKEN
            REDDIT_CLIENT_ID
            REDDIT_CLIENT_SECRET
            SCRAPER_SECRET
        env:
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}

      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://vaultdrop-worker.odehebuka48.workers.dev/health")
          if [ "$STATUS" = "200" ]; then
            echo "Worker deployed successfully and responding!"
          else
            echo "WARNING: Worker returned status $STATUS after deployment"
          fi
