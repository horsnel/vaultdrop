name: Trigger Scrape

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Cloudflare Worker scrape
        run: |
          curl -X POST "https://api.vaultdrop.pages.dev/scraper/trigger" || true
          echo "Scrape triggered on Cloudflare Worker"
